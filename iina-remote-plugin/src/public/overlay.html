<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IINA Remote</title>
    <style>
      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #root {
        display: flex;
        align-items: center;
        background:
          radial-gradient(
            circle at 20% 20%,
            rgba(150, 105, 255, 0.34) 0%,
            rgba(0, 0, 0, 0) 46%
          ),
          radial-gradient(
            circle at 82% 28%,
            rgba(0, 220, 255, 0.28) 0%,
            rgba(0, 0, 0, 0) 52%
          ),
          radial-gradient(
            circle at 50% 92%,
            rgba(190, 190, 210, 0.18) 0%,
            rgba(0, 0, 0, 0) 60%
          ),
          linear-gradient(
            135deg,
            rgba(10, 10, 18, 0.9) 0%,
            rgba(26, 22, 42, 0.9) 45%,
            rgba(8, 8, 12, 0.9) 100%
          );
        color: rgba(255, 255, 255, 1);
        font-family: "Avenir Next", Arial, sans-serif;
        gap: 40px;
        padding: 40px;
        border-radius: 20px;
      }
      #info {
        width: 300px;
        font-size: 1.25em;
      }
      #qr {
        width: 300px;
        height: 300px;
        background: white;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="info">
        <h1>IINA Remote</h1>
        <p>Server: <span id="server">...</span></p>
        <p>Token: <span id="token">...</span></p>
      </div>
      <div id="qr"></div>
    </div>

    <script>
      iina.onMessage("updateConnection", ({ host, port, token, qr }) => {
        document.getElementById("server").textContent = `${host}:${port}`;
        document.getElementById("token").textContent = token;
        document.getElementById("qr").innerHTML = qr;
      });
    </script>
  </body>
</html>
